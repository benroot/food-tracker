<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0A868"/>
      <stop offset="100%" stop-color="#C1652E"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="200" height="200" fill="url(#bg)"/>

  <!-- Ears (outer black, inner brown) -->
  <circle cx="55" cy="50" r="28" fill="#1F1E1C"/>
  <circle cx="55" cy="52" r="16" fill="#8B5A2B"/>
  <circle cx="145" cy="50" r="28" fill="#1F1E1C"/>
  <circle cx="145" cy="52" r="16" fill="#8B5A2B"/>

  <!-- Head: slightly wider than tall for a plumper face -->
  <ellipse cx="100" cy="112" rx="76" ry="68" fill="#FFFFFF"/>

  <!-- Two bamboo shoots crossing lower in the frame, at a shallower angle -->
  <line x1="50" y1="200" x2="150" y2="168" stroke="#8FBB5C" stroke-width="16" stroke-linecap="round"/>
  <line x1="150" y1="200" x2="50" y2="168" stroke="#8FBB5C" stroke-width="16" stroke-linecap="round"/>

  <line x1="82.9" y1="182.1" x2="87.1" y2="195.5" stroke="#5F8A3B" stroke-width="3" stroke-linecap="round"/>
  <line x1="112.9" y1="172.5" x2="117.1" y2="185.9" stroke="#5F8A3B" stroke-width="3" stroke-linecap="round"/>
  <line x1="117.1" y1="182.1" x2="112.9" y2="195.5" stroke="#5F8A3B" stroke-width="3" stroke-linecap="round"/>
  <line x1="87.1" y1="172.5" x2="82.9" y2="185.9" stroke="#5F8A3B" stroke-width="3" stroke-linecap="round"/>

  <path d="M 150 168 Q 168 161 173 166 Q 160 175 150 168 Z" fill="#7FA84A"/>
  <path d="M 150 168 Q 168 176 173 183 Q 157 178 150 168 Z" fill="#7FA84A"/>
  <path d="M 50 168 Q 32 161 27 166 Q 40 175 50 168 Z" fill="#7FA84A"/>
  <path d="M 50 168 Q 32 176 27 183 Q 43 178 50 168 Z" fill="#7FA84A"/>

  <!-- Eye patches -->
  <ellipse cx="72" cy="103" rx="26" ry="32" fill="#1F1E1C"/>
  <ellipse cx="128" cy="103" rx="26" ry="32" fill="#1F1E1C"/>

  <!-- Eyes: anime-style, bigger, with sparkle highlight -->
  <ellipse cx="72" cy="103" rx="12" ry="14" fill="#FFFFFF"/>
  <ellipse cx="73" cy="106" rx="7" ry="8" fill="#1F1E1C"/>
  <circle cx="70" cy="101" r="2.6" fill="#FFFFFF"/>

  <ellipse cx="128" cy="103" rx="12" ry="14" fill="#FFFFFF"/>
  <ellipse cx="129" cy="106" rx="7" ry="8" fill="#1F1E1C"/>
  <circle cx="126" cy="101" r="2.6" fill="#FFFFFF"/>

  <!-- Nose -->
  <ellipse cx="100" cy="142" rx="10" ry="7" fill="#1F1E1C"/>

  <!-- Closed, simple smile -->
  <path d="M 85 150 Q 100 160 115 150" stroke="#1F1E1C" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
