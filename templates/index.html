{% extends "base.html" %}
{% block title %}Weight Log{% endblock %}
{% block content %}
  <h1>Weight Log</h1>

  <form method="post" action="{{ url_for('log_weight') }}">
    <label for="weight_lbs">Today's weight (lbs)</label>
    <input
      type="number"
      id="weight_lbs"
      name="weight_lbs"
      step="0.1"
      min="0"
      required
      autofocus
    >
    <button type="submit">Log weight</button>
  </form>

  <section aria-label="Weight history">
    <h2>History</h2>
    {% if entries %}
      <table>
        <thead>
          <tr>
            <th scope="col">Date</th>
            <th scope="col">Weight</th>
          </tr>
        </thead>
        <tbody>
          {% for entry in entries %}
            <tr>
              <td>{{ entry["entry_date"] }}</td>
              <td>{{ entry["weight_lbs"] }} lbs</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p>No weight logged yet.</p>
    {% endif %}
  </section>
{% endblock %}
