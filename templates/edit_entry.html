{% extends "base.html" %}
{% block title %}Edit Entry{% endblock %}
{% block content %}
  <h1>Edit entry</h1>

  <form method="post" action="{{ url_for('food_entry_edit', item_id=entry['item_id']) }}">
    <label for="food">Food</label>
    <input type="text" id="food" name="food" value="{{ entry['description'] }}" required>

    <label for="calories">Calories</label>
    <input type="number" id="calories" name="calories" min="1" step="1" value="{{ entry['calories'] }}" required>

    <button type="submit">Save changes</button>
  </form>

  <p><a href="{{ url_for('food_page') }}">Cancel</a></p>
{% endblock %}
