{% extends "base.html" %}
{% block title %}Edit Exercise Entry{% endblock %}
{% block content %}
  <h1>Edit entry</h1>

  <form method="post" action="{{ url_for('exercise_entry_edit', entry_id=entry['id']) }}">
    <label for="activity">Activity</label>
    <input type="text" id="activity" name="activity" value="{{ entry['activity'] }}" required>

    <label for="calories">Calories</label>
    <input type="number" id="calories" name="calories" min="1" step="1" value="{{ entry['calories_burned'] }}" required>

    <button type="submit">Save changes</button>
  </form>

  <p><a href="{{ url_for('exercise_page') }}">Cancel</a></p>
{% endblock %}
